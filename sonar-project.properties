sonar.organization=spchandera
sonar.projectKey=spchandera_Shoppicd

# --- Sources ---------------------------------------------------------------
sonar.sources=assets,sections,snippets,blocks,layout,templates,config,locales,src
sonar.sourceEncoding=UTF-8

# --- Tests -----------------------------------------------------------------
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

# --- Analysis exclusions ---------------------------------------------------
# Vendored / third-party minified libraries (not our code to maintain).
sonar.exclusions=assets/instant-page.js,node_modules/**,coverage/**

# --- Coverage --------------------------------------------------------------
# lcov report produced by `npm run coverage` (Vitest + v8).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# The storefront components are browser-coupled and not yet unit tested, so
# they are excluded from the coverage measure. Coverage currently tracks the
# extracted, tested modules under src/. Remove entries here as tests are added.
sonar.coverage.exclusions=assets/**,sections/**,snippets/**,blocks/**,layout/**,templates/**,config/**,locales/**

# --- Copy/paste detection --------------------------------------------------
# These standalone drawer/modal files are unused leftovers: the same classes
# and custom elements are bundled in assets/main.js, so they are pure
# duplicates. Recommended to delete them; excluded here in the meantime.
sonar.cpd.exclusions=assets/side-drawer.js,assets/modal.js,assets/dockable-side-drawer.js,assets/instant-page.js
